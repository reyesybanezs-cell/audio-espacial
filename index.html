<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transparencia por Cable</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #1c1c1e;
      border: 1px solid #2c2c2e;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
    }
    h2 { margin: 0 0 8px 0; font-size: 1.3rem; text-align: center; }
    p.desc { color: #8e8e93; font-size: 0.85rem; text-align: center; margin-bottom: 20px; }
    
    .field { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    select, input[type="range"] {
      width: 100%;
      background: #2c2c2e;
      color: #fff;
      border: 1px solid #3a3a3c;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
    }
    button {
      background: #30d158;
      color: #000;
      font-weight: bold;
      border: none;
      padding: 16px;
      border-radius: 50px;
      width: 100%;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    button.active { background: #ff453a; color: #fff; }
    .vol-label { display: flex; justify-content: space-between; }

    /* Medidor de nivel de audio */
    .meter-container {
      width: 100%;
      height: 10px;
      background: #2c2c2e;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 6px;
    }
    .meter-bar {
      height: 100%;
      width: 0%;
      background: #30d158;
      transition: width 0.05s ease;
    }
    #status {
      font-size: 0.8rem;
      text-align: center;
      margin-top: 10px;
      color: #0a84ff;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Escucha Ambiental</h2>
  <p class="desc">Audífonos por Cable + Micrófono del Celular</p>

  <div class="field">
    <label for="micSelect">Seleccionar Micrófono</label>
    <select id="micSelect">
      <option value="">Por defecto del sistema</option>
    </select>
  </div>

  <div class="field">
    <div class="vol-label">
      <label for="volume">Volumen Ambiental</label>
      <span id="volVal" style="font-size: 0.8rem; color:#30d158;">100%</span>
    </div>
    <input type="range" id="volume" min="0" max="300" value="100">
  </div>

  <div class="field">
    <label>Señal de Entrada (Micrófono)</label>
    <div class="meter-container">
      <div id="meterBar" class="meter-bar"></div>
    </div>
  </div>

  <button id="toggleBtn">Iniciar Audio</button>
  <div id="status">Estado: Apagado</div>
</div>

<script>
  let audioCtx = null;
  let micStream = null;
  let gainNode = null;
  let analyser = null;
  let animId = null;
  let isRunning = false;

  const toggleBtn = document.getElementById('toggleBtn');
  const micSelect = document.getElementById('micSelect');
  const volumeSlider = document.getElementById('volume');
  const volVal = document.getElementById('volVal');
  const meterBar = document.getElementById('meterBar');
  const statusDiv = document.getElementById('status');

  volumeSlider.addEventListener('input', (e) => {
    const val = e.target.value;
    volVal.textContent = val + '%';
    if (gainNode) gainNode.gain.value = val / 100;
  });

  micSelect.addEventListener('change', async () => {
    if (isRunning) {
      await startAudio(); // Reiniciar con el nuevo micrófono seleccionado
    }
  });

  toggleBtn.addEventListener('click', async () => {
    if (!isRunning) {
      await startAudio();
    } else {
      stopAudio();
    }
  });

  async function listMics() {
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const audioInputs = devices.filter(d => d.kind === 'audioinput');
      
      const currentSelection = micSelect.value;
      micSelect.innerHTML = '';
      
      audioInputs.forEach((device, index) => {
        const option = document.createElement('option');
        option.value = device.deviceId;
        option.text = device.label || `Micrófono ${index + 1}`;
        if (device.deviceId === currentSelection) option.selected = true;
        micSelect.appendChild(option);
      });
    } catch (e) {
      console.error(e);
    }
  }

  async function startAudio() {
    stopAudio(); // Limpiar instancias previas

    try {
      statusDiv.textContent = "Iniciando...";
      
      const constraints = {
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false,
          latency: 0
        }
      };

      if (micSelect.value) {
        constraints.audio.deviceId = { exact: micSelect.value };
      }

      micStream = await navigator.mediaDevices.getUserMedia(constraints);
      await listMics();

      // AudioContext adaptativo (evita bloqueo por tasa de muestreo estricta)
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });

      // FORZAR ACTIVACIÓN DEL AUDIO (Solución al silencio en Chrome)
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      const source = audioCtx.createMediaStreamSource(micStream);
      gainNode = audioCtx.createGain();
      gainNode.gain.value = volumeSlider.value / 100;

      // Analizador para el medidor visual
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 64;

      // Conexión de nodos
      source.connect(analyser);
      analyser.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      isRunning = true;
      toggleBtn.textContent = 'Detener Audio';
      toggleBtn.classList.add('active');
      statusDiv.textContent = "Estado: Escuchando en vivo (" + audioCtx.state + ")";

      drawMeter();
    } catch (err) {
      statusDiv.textContent = "Error: " + err.message;
      alert('Error al acceder al micrófono: ' + err.message);
    }
  }

  function drawMeter() {
    if (!analyser || !isRunning) return;
    const dataArray = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(dataArray);
    
    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) {
      sum += dataArray[i];
    }
    const average = sum / dataArray.length;
    const percentage = Math.min(100, Math.round((average / 128) * 100));
    
    meterBar.style.width = percentage + '%';
    animId = requestAnimationFrame(drawMeter);
  }

  function stopAudio() {
    if (animId) cancelAnimationFrame(animId);
    if (micStream) micStream.getTracks().forEach(track => track.stop());
    if (audioCtx) audioCtx.close();
    
    isRunning = false;
    meterBar.style.width = '0%';
    toggleBtn.textContent = 'Iniciar Audio';
    toggleBtn.classList.remove('active');
    statusDiv.textContent = "Estado: Apagado";
  }
</script>
</body>
</html>
